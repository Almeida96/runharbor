name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package
        shell: bash
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Exercise recovery and review
        shell: bash
        run: build/install/runharbor/bin/runharbor demo --out build/ci-demo
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
            build/test-results/test/*.xml
            build/ci-demo/*.json
            build/ci-demo/*.md
      - name: Upload distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release RunHarbor 0.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: release
      - name: Create checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum runharbor-0.1.0.zip > SHA256SUMS
          gh release create v0.1.0 runharbor-0.1.0.zip SHA256SUMS --target "$GITHUB_SHA" --title "RunHarbor 0.1.0" --notes-file ../docs/release-0.1.0.md
